name: older-era
# 補抓 2010-01～2015-05 更早的資料到 data/older/（研究用的全新檢驗期；網站不讀）
on:
  workflow_dispatch:
    inputs:
      commit:
        type: boolean
        default: true
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      OLD_START: "2010-01-01"
      OLD_END: "2015-05-31"
      REV_YEARS: "2009,2010,2011,2012,2013,2014,2015"
    strategy:
      fail-fast: false
      matrix:
        job: [prices-2010, prices-2011, prices-2012, prices-2013, prices-2014, prices-2015, chips-2010, chips-2011, chips-2012, chips-2013, chips-2014, chips-2015, misc]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas
      - run: |
          J="${{ matrix.job }}"; python tools/old_era.py ${J%%-*} $( [[ "$J" == *-* ]] && echo ${J##*-} )
      - uses: actions/upload-artifact@v4
        with:
          name: older-${{ matrix.job }}
          path: out/
  merge:
    needs: fetch
    if: ${{ always() && inputs.commit }}
    runs-on: ubuntu-latest
    concurrency: data-writes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: incoming
          merge-multiple: true
      - run: |
          ls -la incoming
          mkdir -p data/older/history data/older/chips data/older/revenue
          for f in incoming/hist-*.csv.gz; do [ -f "$f" ] && cp "$f" "data/older/history/$(basename $f | sed 's/hist-//')"; done
          for f in incoming/chips-*.csv.gz; do [ -f "$f" ] && cp "$f" "data/older/chips/$(basename $f | sed 's/chips-//')"; done
          for f in incoming/revenue-*.csv.gz; do [ -f "$f" ] && cp "$f" "data/older/revenue/$(basename $f | sed 's/revenue-//')"; done
          for f in adjust.csv disposal.csv; do [ -f "incoming/$f" ] && cp "incoming/$f" data/older/; done
          cat incoming/*.failed.txt incoming/*.closed.txt > data/older/fetch_notes.txt 2>/dev/null || true
          git config user.name github-actions; git config user.email actions@github.com
          git add data/old
          if ! git diff --cached --quiet; then git commit -q -m "older era data 2010-01..2015-05" && git pull --rebase -q && git push; fi
