name: probe-apis
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python tools/probe_disposal.py
      - name: push to probe branch
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git checkout -B probe
          git add -f probe
          git commit -q -m "probe results" || true
          git push -f origin probe
