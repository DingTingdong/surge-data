name: maintenance
on:
  workflow_dispatch:
    inputs:
      script:
        description: "要執行的 tools/ 腳本"
        required: true
      commit:
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    concurrency: data-writes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas numpy
      - run: python tools/${{ inputs.script }}
      - name: commit
        if: ${{ inputs.commit }}
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add data
          if ! git diff --cached --quiet; then git commit -q -m "maintenance: ${{ inputs.script }}" && git pull --rebase -q && git push; fi
