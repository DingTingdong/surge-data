name: update-prices
on:
  schedule:
    # GitHub 的排程常延遲好幾小時甚至漏跑（11/17 四個時段全部沒跑），所以排很多個時間；
    # 每次執行只補缺的資料，資料已齊全時幾乎不做事、也不會產生 commit
    - cron: "40 6 * * 1-5"        # 台北 14:40，收盤行情（證交所、櫃買下午就公布）
    - cron: "20 7 * * 1-5"        # 台北 15:20（備援）
    - cron: "10 8 * * 1-5"        # 台北 16:10（備援）
    - cron: "10 9 * * 1-5"        # 台北 17:10（備援）
    - cron: "20 10 * * 1-5"       # 台北 18:20
    - cron: "55 10 * * 1-5"       # 台北 18:55（備援）
    - cron: "35 11 * * 1-5"       # 台北 19:35（備援）
    - cron: "25 12 * * 1-5"       # 台北 20:25（備援）
    - cron: "25 13 * * 1-5"       # 台北 21:25（備援）
    - cron: "10 14 * * 1-5"       # 台北 22:10，補融資融券（晚上才公布）
    - cron: "5 15 * * 1-5"        # 台北 23:05（備援）
    - cron: "35 16 * * 1-5"       # 台北 00:35（備援）
    - cron: "15 18 * * 1-5"       # 台北 02:15（備援）
    - cron: "40 20 * * 1-5"       # 台北 04:40（備援）
    - cron: "50 22 * * 1-5"       # 台北 06:50（備援，開盤前確保前一天資料完整）
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    concurrency: data-writes
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas numpy scikit-learn==1.9.1 lxml
      - run: python fetch_prices.py
      - run: python fetch_disposal.py || echo 'disposal fetch failed, continuing'
      - run: python fetch_adjust.py || echo 'adjust fetch failed, continuing'
      - run: python fetch_chips.py || echo 'chips fetch failed, continuing'
      - run: python fetch_industry.py || echo 'industry fetch failed, continuing'
      - run: python fetch_revenue.py || echo 'revenue fetch failed, continuing'
      - run: python fetch_etf.py || echo 'etf fetch failed, continuing'
      - run: python tools/fetch_fin.py pit || echo 'fin pit archive failed, continuing'
      - run: python fetch_tdcc.py || echo 'tdcc fetch failed, continuing'
      - run: python tools/fetch_cb_list.py || echo 'cb list fetch failed, continuing'
      - run: python tools/fetch_sbl_daily.py || echo 'sbl daily fetch failed, continuing'
      - run: python build_site.py
      - name: commit
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add data docs
          if ! git diff --cached --quiet; then git commit -m "update prices" && git pull --rebase -q && git push; fi
