name: update-prices
on:
  schedule:
    # GitHub 的排程常延遲甚至漏跑，所以排多個時間；每次執行只補缺的資料，重複跑沒關係
    - cron: "30 10 * * 1-5"   # 台北 18:30
    - cron: "45 11 * * 1-5"   # 台北 19:45（備援）
    - cron: "10 14 * * 1-5"   # 台北 22:10，補融資融券（晚上才公布）
    - cron: "40 15 * * 1-5"   # 台北 23:40（備援）
    - cron: "50 22 * * 1-5"   # 台北隔天 06:50（備援，開盤前確保前一天資料完整）
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    concurrency: data-writes
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas numpy
      - run: python fetch_prices.py
      - run: python fetch_disposal.py || echo 'disposal fetch failed, continuing'
      - run: python fetch_adjust.py || echo 'adjust fetch failed, continuing'
      - run: python fetch_chips.py || echo 'chips fetch failed, continuing'
      - run: python build_site.py
      - name: commit
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add data docs
          if ! git diff --cached --quiet; then git commit -m "update prices" && git pull --rebase -q && git push; fi
