name: update-prices
on:
  schedule:
    - cron: "30 10 * * 1-5"   # 台北時間平日 18:30
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    concurrency: data-writes
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas numpy
      - run: python fetch_prices.py
      - run: python build_site.py
      - name: commit
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add data docs
          if ! git diff --cached --quiet; then git commit -m "update prices" && git pull --rebase -q && git push; fi
