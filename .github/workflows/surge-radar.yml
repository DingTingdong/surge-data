name: Surge Radar data reader

on:
  workflow_run:
    workflows: ['update-prices']
    types: [completed]
    branches: [main]
  schedule:
    - cron: '23 12,13,14 * * 1-5'
    - cron: '23 0 * * 2-6'
  workflow_dispatch:
    inputs:
      require_complete:
        description: Require every source to be published and verified before reporting success.
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: surge-radar-production
  cancel-in-progress: false

jobs:
  refresh:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out backend bootstrap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Test bootstrap without production credentials
        run: node --test radar-backend/run.test.mjs

      - name: Refresh and verify Surge Radar data
        run: node --use-env-proxy radar-backend/run.mjs
        env:
          SURGE_RADAR_SITE_TOKEN: ${{ secrets.SURGE_RADAR_SITE_TOKEN }}
          GITHUB_READ_TOKEN: ${{ github.token }}
          SURGE_REQUIRE_COMPLETE: ${{ github.event_name == 'workflow_dispatch' && inputs.require_complete }}
